[project]
name = "aktreader-research"
version = "0.3.0.dev0"
description = "Evidence, evaluation, and reproducibility tooling for the local AKT Reader application."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jacob Goldstein" }]
dependencies = [
    "jsonschema>=4.23,<5",
    "pillow>=11,<13",
]

[project.urls]
Homepage = "https://github.com/jakegold1647/aktreader-research"
Repository = "https://github.com/jakegold1647/aktreader-research"
Issues = "https://github.com/jakegold1647/aktreader-research/issues"
Changelog = "https://github.com/jakegold1647/aktreader-research/blob/main/CHANGELOG.md"

[project.scripts]
# ``aktreader-lab`` is the unambiguous command. Keep the v0.2.0 name as an alias
# for source-checkout workflows that already use it.
aktreader-lab = "aktreader.cli:main"
aktreader = "aktreader.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aktreader.assets" = ["schemas/*.json", "resources/*.csv"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
